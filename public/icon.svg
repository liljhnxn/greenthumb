      <stop offset="0%" stop-color="#1E2B20"/>
      <stop offset="100%" stop-color="#111A13"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7F58E"/>
